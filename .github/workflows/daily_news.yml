name: Daily News Automation

on:
  schedule:
    - cron: '31 1 * * *' # UTC 01:31 is Beijing 09:31
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Run News Push
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          KEYWORDS: ${{ secrets.KEYWORDS }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gemini-3-flash-preview' }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          DOUBAO_ENDPOINT: ${{ secrets.DOUBAO_ENDPOINT }}
          DOUBAO_MODEL: ${{ secrets.DOUBAO_MODEL }}
          USER_CONTEXT: ${{ secrets.USER_CONTEXT }}
          FOCUS_MEDIA: ${{ secrets.FOCUS_MEDIA }}
        run: |
          npx tsx scripts/run-daily.ts
